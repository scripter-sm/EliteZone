name: Compile GUI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Compile GUI
      run: |
        node Compiler/compile_gui.js
    
    - name: Commit compiled GUI
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Dependencies/libraries/gui.lua
        git commit -m "Auto-compile GUI"
        git push