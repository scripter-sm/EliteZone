name: Compile Window Library

on:
  push:
    branches: [ main ]
    paths: [ 'Sources/window/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'Sources/window/**' ]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Compile Window Library
      run: |
        node Compiler/compile_window_library.js

    - name: Commit compiled Window Library
      if: github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Dependencies/libraries/window_library.lua Dependencies/window_library_version.dat
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "build: auto-compile window library."
          git push
        fi
